# Ледниковые курорты IT / FR / AT с катанием выше 3000 м (Passo Tonale исключён).
#
# lift_pass — цена ски-пасса на `days` дней, по периодам сезона.
#   periods: первый период, в который попадает дата первого ски-дня; иначе default.
#   child_tiers: правила для ребёнка, проверяются сверху вниз, первое совпадение выигрывает.
#     born_from: YYYY-MM-DD  — ребёнок родился в эту дату или позже (Австрия считает по году рождения)
#     max_age: N            — возраст в первый ски-день ≤ N (Франция считает по возрасту)
#     price: 0 / число за весь пасс / "child" (детская цена периода)
#   family_flex: true — при ≥1 платном ребёнке до 2 взрослых платят детский тариф.
#   status: verified_2026_27 | from_2025_26 | estimate — насколько можно доверять цифре.
#
# airports: км по дороге до курорта (оценка), часы = км / 70 считаются в коде.
# lodging_bbox: [юг, запад, север, восток] — где искать жильё (деревня + соседние).

