name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      # Демо-отчёт на синтетике: проверяет, что отчёт собирается. Реальный сбор цен
      # отсюда не запускаем — Google и Airbnb блокируют IP дата-центров.
      - run: python -m skitrip demo
      # Сайт: последний слепок с реальными ценами — главная страница, все слепки — в /snapshots/.
      - name: Build site
        run: |
          mkdir -p site
          latest=$(ls -d snapshots/*/ | sort | tail -1)
          cp "${latest}report.html" site/index.html
          cp -r snapshots site/snapshots
          find site/snapshots -name '*.sqlite' -delete
          cp data/report-demo.html site/demo.html
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
