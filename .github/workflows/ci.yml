name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      # Демо-отчёт на синтетике: проверяет, что отчёт собирается. Реальный сбор цен
      # отсюда не запускаем — Google и Airbnb блокируют IP дата-центров.
      - run: python -m skitrip demo
      - uses: actions/upload-artifact@v4
        with:
          name: report-demo
          path: data/report-demo.html
