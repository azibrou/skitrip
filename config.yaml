party:
  adults: 2
  children:
    - birth_date: 2020-06-01   # ← поставьте точную дату: от неё зависит, бесплатный ли ски-пасс (Австрия считает по году рождения)

trip:
  origin: TLL                 # основной город вылета
  origins:                    # откуда искать перелёты: код → наземная дорога до аэропорта на всю группу, EUR
    TLL: 0
    RIX: 150                  # автобус Таллин⇄Рига (Lux Express), 3 чел. туда-обратно, ~4,5 ч в одну сторону
  currency: EUR
  nights: 7
  ski_days: 6                 # длина ски-пасса
  pass_children: false        # false — ски-пассы только на взрослых, ребёнок не катается
  checkin_weekday: 5          # 0 = пн … 5 = сб
  min_top_m: 0                # фильтр по высоте верхней точки, м; 0 — все ледники
  season_from: 2026-12-05
  season_to: 2027-04-10       # последняя дата заезда

flights:
  max_stops: 1

self_transfer:                # два отдельных билета Ryanair через хаб, с повторной регистрацией
  enabled: true
  min_connection_h: 3         # запас между рейсами
  delay_s: [3, 7]             # пауза между запросами к Google
  max_consecutive_errors: 4

lodging:
  source: airbnb
  place_type: "Entire home/apt"
  min_bedrooms: 1
  stat: p25                   # чем считать цену жилья: p25 | median | min
  min_results: 5              # меньше вариантов → неделя помечается «мало предложений»
  delay_s: [4, 9]

transfer:
  car_rent_week: 0            # аренда машины на неделю, EUR; 0 — машину не считаем (раньше 320)
  per_km: 0                   # топливо + платные дороги, EUR/км; 0 — не считаем (раньше 0.16)

costs:
  ski_bag_per_person_rt: 0    # если везёте свои доски/лыжи — сбор авиакомпании туда-обратно на человека

alerts:
  drop_pct: 10
